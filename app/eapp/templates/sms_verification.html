{% extends 'layout/base.html' %}

{% block title %}Security{% endblock%}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0 fw-bold">XÁC THỰC SĐT</h4>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="post">
                    <label for="sms" class="mb-2">Nhập sms gửi tới số điện thoại {{ so_dien_thoai }}:</label>
                    <input type="text" class="form-control mb-3" placeholder="000000"
                           id="sms" name="sms" maxlength="6" pattern="[0-9]{6}" required />

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold">Xác thực</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
